<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><title id="t">Accuracy against model size</title><desc id="d">Unseen knowledge multiple-choice accuracy rises from 50.5 percent at 0.6B to 81.0 percent at 14B; dev decision suites rise from 60.7 to 76.4 percent.</desc><rect width="720" height="420" fill="#fcfcfb"/><text x="64" y="30" font-size="17" font-weight="600" fill="#0b0b0b">Accuracy rises with model size</text><text x="64" y="50" font-size="12" fill="#52514e">SCM, same data and recipe, one seed, open development sets</text><g font-size="12" fill="#52514e"><rect x="64" y="62" width="14" height="3" fill="#2a78d6"/><text x="84" y="68">Unseen knowledge multiple choice</text><rect x="314" y="62" width="14" height="3" fill="#eb6834"/><text x="334" y="68">Dev decision suites (5)</text></g><line x1="64" x2="680" y1="317.8" y2="317.8" stroke="#e4e3df" stroke-width="1"/><text x="56" y="321.8" font-size="11" fill="#52514e" text-anchor="end">50%</text><line x1="64" x2="680" y1="253.2" y2="253.2" stroke="#e4e3df" stroke-width="1"/><text x="56" y="257.2" font-size="11" fill="#52514e" text-anchor="end">60%</text><line x1="64" x2="680" y1="188.8" y2="188.8" stroke="#e4e3df" stroke-width="1"/><text x="56" y="192.8" font-size="11" fill="#52514e" text-anchor="end">70%</text><line x1="64" x2="680" y1="124.2" y2="124.2" stroke="#e4e3df" stroke-width="1"/><text x="56" y="128.2" font-size="11" fill="#52514e" text-anchor="end">80%</text><text x="92.7" y="372" font-size="12" fill="#52514e" text-anchor="middle">0.6B</text><text x="257.0" y="372" font-size="12" fill="#52514e" text-anchor="middle">1.7B</text><text x="391.9" y="372" font-size="12" fill="#52514e" text-anchor="middle">4B</text><text x="501.2" y="372" font-size="12" fill="#52514e" text-anchor="middle">8B</text><text x="589.4" y="372" font-size="12" fill="#52514e" text-anchor="middle">14B</text><line